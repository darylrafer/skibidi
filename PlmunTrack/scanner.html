<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PLMun - Gate Scanner</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        body { font-family: 'Poppins', sans-serif; background-color: #0b1120; background-image: radial-gradient(circle at top right, #1e3a8a 0%, transparent 40%), radial-gradient(circle at bottom left, #0f766e 0%, transparent 40%); display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; padding: 15px; }
        .terminal-card { background: #111827; width: 100%; max-width: 500px; padding: 30px; border-radius: 24px; box-shadow: 0 25px 50px rgba(0,0,0,0.5); text-align: center; border: 1px solid #1f2937; position: relative; overflow: hidden; }
        .terminal-card::before { content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 4px; background: linear-gradient(90deg, #fbbf24, #f59e0b); }
        h2 { color: #ffffff; font-weight: 700; }
        p { color: #9ca3af; font-size: 14px; }
        #reader { width: 100%; border-radius: 16px; overflow: hidden; border: 3px solid #374151; margin-bottom: 20px; display: none; box-shadow: 0 0 25px rgba(59, 130, 246, 0.2); }
        .status-area { padding: 25px 20px; border-radius: 20px; display: none; margin-bottom: 20px; animation: slideUp 0.3s ease-out; }
        .status-title { font-size: 36px; font-weight: 800; margin-bottom: 5px; }
        .status-name { font-size: 18px; font-weight: 600; opacity: 0.9; }
        .bg-in { background: rgba(16, 185, 129, 0.1); color: #10b981; border: 2px solid rgba(16, 185, 129, 0.3); }
        .bg-out { background: rgba(59, 130, 246, 0.1); color: #3b82f6; border: 2px solid rgba(59, 130, 246, 0.3); }
        .bg-error { background: rgba(239, 68, 68, 0.1); color: #ef4444; border: 2px solid rgba(239, 68, 68, 0.3); }
        @keyframes slideUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .btn-custom { background: #1e3a8a; color: white; border: none; padding: 15px; border-radius: 12px; font-weight: 600; width: 100%; transition: 0.3s; font-size: 16px; box-shadow: 0 5px 15px rgba(30, 58, 138, 0.3); margin-bottom: 10px; }
        .btn-custom:hover { background: #1e40af; }
        .sidebar { width: 260px; background: #111827; min-height: 100vh; position: fixed; top: 0; left: 0; padding: 20px 0; display: flex; flex-direction: column; z-index: 1000; transition: 0.3s; transform: translateX(-100%); box-shadow: 5px 0 15px rgba(0,0,0,0.5); border-right: 1px solid #1f2937; }
        .sidebar.active { transform: translateX(0); }
        .sidebar .brand { padding: 0 20px 20px 20px; border-bottom: 1px solid #1f2937; margin-bottom: 20px; display: flex; align-items: center; gap: 10px;}
        .sidebar .brand h4 { color: white; font-size: 1.1rem; margin: 0; font-weight: 700; line-height: 1.2;}
        .sidebar .brand span { color: #fbbf24; font-size: 0.8rem; font-weight: 500;}
        .sidebar a { color: #9ca3af; text-decoration: none; padding: 12px 20px; display: flex; align-items: center; gap: 12px; font-weight: 500; transition: 0.2s; font-size: 14px;}
        .sidebar a:hover, .sidebar a.active { background: #1f2937; color: white; border-left: 3px solid #fbbf24; }
        .sidebar a i { font-size: 18px; }
        .overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 999; }
        .overlay.active { display: block; }

        /* Camera switch button */
        .switch-cam-btn {
            display: inline-flex; align-items: center; justify-content: center; gap: 8px;
            background: #1f2937; color: #fbbf24; border: 1px solid #374151;
            padding: 10px 18px; border-radius: 12px; font-weight: 600; font-size: 14px;
            cursor: pointer; transition: 0.3s; width: 100%; margin-bottom: 10px;
        }
        .switch-cam-btn:hover { background: #374151; color: #ffffff; border-color: #fbbf24; }
        .switch-cam-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .switch-cam-btn i { font-size: 18px; }
    </style>
</head>
<body>

<div class="overlay" id="overlay" onclick="toggleSidebar()"></div>

<div class="sidebar" id="sidebar">
    <div class="brand">
        <img src="plmun_logo.png" alt="Logo" style="width: 40px; height: 40px; border-radius: 50%;" onerror="this.src='https://ui-avatars.com/api/?name=PLM&background=1e3a8a&color=fff'">
        <div><h4>PLMUN</h4><span>Admin Portal</span></div>
    </div>
    <a href="./admin_dashboard.html"><i class="bi bi-grid-1x2-fill"></i> Dashboard</a>
    <a href="./scanner.html" class="active"><i class="bi bi-camera-fill"></i> Gate Scanner</a>
    <a href="./profile.html"><i class="bi bi-person-fill"></i> My Profile</a>
    <div style="margin-top: auto; border-top: 1px solid #1f2937; padding-top: 20px;">
        <a href="#" onclick="logout(event)" style="color: #ef4444;"><i class="bi bi-box-arrow-right"></i> Logout</a>
    </div>
</div>

<div class="terminal-card">
    <button class="menu-btn" onclick="toggleSidebar()" style="position: absolute; top: 20px; left: 20px; background: transparent; border: none; color: #ffffff; font-size: 28px; cursor: pointer; z-index: 10;"><i class="bi bi-list"></i></button>

    <div class="mb-4 mt-2">
        <h2 style="color: #ffffff; font-weight: 700;">Gate Terminal</h2>
        <p style="color: #9ca3af; font-size: 14px;">Position the QR code within the frame.</p>
    </div>

    <div id="reader"></div>
    <div id="statusBox" class="status-area"></div>

    <div id="controls">
        <button id="switchCamBtn" class="switch-cam-btn" onclick="switchCamera()" style="display: none;">
            <i class="bi bi-arrow-repeat"></i>
            <span id="switchCamLabel">Switch to Front Camera</span>
        </button>
        <button id="startBtn" class="btn-custom" onclick="startCamera()" style="display: none;">📷 Start Camera</button>
    </div>
</div>

<script>
    const currentUser = JSON.parse(localStorage.getItem('currentUser'));
    if (!currentUser || (currentUser.role !== 'Admin' && currentUser.role !== 'Staff')) {
        alert('Access Denied.');
        window.location.href = 'login.html';
    }
    function toggleSidebar() {
        document.getElementById('sidebar').classList.toggle('active');
        document.getElementById('overlay').classList.toggle('active');
    }
    function logout(e) {
        if (e) e.preventDefault();
        localStorage.removeItem('currentUser');
        window.location.href = 'login.html';
    }
</script>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, collection, query, where, getDocs, addDoc, Timestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyAvEt5YujwsC5iZGiBUNrCvcsy0IUIztUk",
        authDomain: "plmun-system-v2.firebaseapp.com",
        projectId: "plmun-system-v2",
        storageBucket: "plmun-system-v2.firebasestorage.app",
        messagingSenderId: "348432254532",
        appId: "1:348432254532:web:5b1b138997f77a59ccb1e1"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const statusBox = document.getElementById('statusBox');
    const startBtn = document.getElementById('startBtn');
    const switchCamBtn = document.getElementById('switchCamBtn');
    const switchCamLabel = document.getElementById('switchCamLabel');
    const readerDiv = document.getElementById('reader');

    let html5QrCode = null;
    let isProcessing = false;
    let lastScannedCode = '';
    let lastScanTime = 0;
    const COOLDOWN_MS = 1500;

    // ✅ Camera facing mode: 'environment' (back) or 'user' (front)
    let currentFacingMode = 'environment';

    window.addEventListener('load', () => {
        const user = JSON.parse(localStorage.getItem('currentUser'));
        if (user && (user.role === 'Admin' || user.role === 'Staff')) {
            setTimeout(() => window.startCamera(), 300);
        }
    });

    // ✅ FULL START (also used for restart after scan + camera switch)
    window.startCamera = async function() {
        if (html5QrCode) {
            try { await html5QrCode.stop(); } catch (e) {}
            try { html5QrCode.clear(); } catch (e) {}
            html5QrCode = null;
        }

        readerDiv.innerHTML = '';
        readerDiv.style.display = 'block';
        startBtn.style.display = 'none';
        statusBox.style.display = 'none';
        switchCamBtn.style.display = 'inline-flex';

        switchCamLabel.innerText = currentFacingMode === 'environment'
            ? 'Switch to Front Camera'
            : 'Switch to Back Camera';

        html5QrCode = new Html5Qrcode("reader");
        const config = { fps: 15, qrbox: { width: 250, height: 250 } };

        try {
            await html5QrCode.start({ facingMode: currentFacingMode }, config, onScanSuccess, onScanError);
        } catch (err) {
            console.error("Camera error:", err);
            alert("Camera Error: " + err + "\n\nPlease allow camera permission and reload.");
            startBtn.style.display = 'block';
            switchCamBtn.style.display = 'none';
        }
    };

    // ✅ SWITCH CAMERA (front <-> back)
    window.switchCamera = async function() {
        if (isProcessing) return;

        switchCamBtn.disabled = true;
        switchCamLabel.innerText = 'Switching...';

        currentFacingMode = currentFacingMode === 'environment' ? 'user' : 'environment';

        await window.startCamera();

        switchCamBtn.disabled = false;
    };

    function playSound(type) {
        try {
            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = ctx.createOscillator(); const gain = ctx.createGain();
            osc.connect(gain); gain.connect(ctx.destination);
            if (type === 'success') { osc.frequency.value = 880; }
            if (type === 'error')   { osc.frequency.value = 200; }
            osc.start(); gain.gain.exponentialRampToValueAtTime(0.00001, ctx.currentTime + 0.5); osc.stop(ctx.currentTime + 0.5);
        } catch (e) {}
    }

    async function onScanSuccess(decodedText, decodedResult) {
        const now = Date.now();
        if (isProcessing) return;
        if (decodedText === lastScannedCode && now - lastScanTime < COOLDOWN_MS) return;

        isProcessing = true;
        lastScannedCode = decodedText;
        lastScanTime = now;

        try {
            if (html5QrCode) {
                await html5QrCode.stop();
                html5QrCode.clear();
                html5QrCode = null;
            }
        } catch (e) { console.warn("Stop failed:", e); }

        switchCamBtn.style.display = 'none';

        statusBox.style.display = 'block';
        statusBox.className = 'status-area bg-in';
        statusBox.innerHTML = '<h4 class="m-0" style="color: #9ca3af;">Processing...</h4>';

        try {
            const usersRef = collection(db, "users");
            const q = query(usersRef, where("qrString", "==", decodedText));
            const querySnapshot = await getDocs(q);

            if (querySnapshot.empty) throw new Error("Invalid QR Code.");

            const userDoc = querySnapshot.docs[0];
            const userData = userDoc.data();
            const userId = userDoc.id;

            const today = new Date(); today.setHours(0,0,0,0);
            const logsRef = collection(db, "logs");
            const logQuery = query(logsRef, where("userId", "==", userId), where("timestamp", ">=", Timestamp.fromDate(today)));
            const logSnapshot = await getDocs(logQuery);

            let action = "IN";
            if (!logSnapshot.empty) {
                const existingLog = logSnapshot.docs[logSnapshot.size - 1].data();
                if (existingLog.action === "IN") { action = "OUT"; }
                else { throw new Error("Already checked out today. Come back tomorrow."); }
            }

            await addDoc(collection(db, "logs"), {
                userId: userId, fullName: userData.fullName, action: action, timestamp: Timestamp.now(), gate: "Main Gate"
            });

            playSound('success');
            if (navigator.vibrate) navigator.vibrate([100, 50, 100]);

            if (action === 'IN') {
                statusBox.className = 'status-area bg-in';
                statusBox.innerHTML = `<div class="status-title">IN</div><div class="status-name">${userData.fullName}</div>`;
            } else {
                statusBox.className = 'status-area bg-out';
                statusBox.innerHTML = `<div class="status-title">OUT</div><div class="status-name">${userData.fullName}</div>`;
            }

        } catch (error) {
            playSound('error');
            if (navigator.vibrate) navigator.vibrate(300);
            statusBox.className = 'status-area bg-error';
            statusBox.innerHTML = `<div class="status-title" style="font-size: 24px;">DENIED</div><div class="status-name" style="font-size:14px;">${error.message}</div>`;
        }

        // ✅ AUTO-RESTART with the SAME camera that was in use
        setTimeout(async () => {
            statusBox.style.display = 'none';
            lastScannedCode = '';
            isProcessing = false;
            await window.startCamera();
        }, COOLDOWN_MS);
    }

    function onScanError(errorMessage) { /* Ignore */ }
</script>
</body>
</html>
